<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- MAAS Branding & PWA Meta Tags -->
  <title>MAAS Group of Companies - Employee Management & 8H Working System</title>
  <meta name="description" content="MAAS Group of Companies - Employee Management, Admin Dashboard & 8-Hour Working Hours Tracking System" />
  <meta name="theme-color" content="#e6007e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAAS Portal" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/images/maas-logo.png" />
  <link rel="apple-touch-icon" href="/images/maas-logo.png" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Application Stylesheet (Pink & Blue Theme) -->
  <link rel="stylesheet" href="/css/style.css?v=maas-2026-v3" />
</head>
<body>
  <!-- Global Toast Notifications Stack -->
  <div id="toast-container"></div>

  <!-- Main Application Wrapper -->
  <div id="app-container">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar-container" style="display: none;"></aside>

    <!-- Main Content Flow -->
    <div class="main-wrapper" id="main-wrapper">
      <!-- Top Navigation Bar -->
      <header class="topbar" id="topbar-container" style="display: none;"></header>

      <!-- View Container (Login / Admin / Manager / Employee) -->
      <main class="content-body" id="view-content">
        <div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
          <div style="text-align: center;">
            <img src="/images/maas-logo.png" alt="MAAS Group of Companies" class="maas-logo-img-login" style="margin-bottom: 1rem;" />
            <p style="color: var(--maas-pink); font-weight: 600;">Loading MAAS Workspace...</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Shown on small screens) -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" style="display: none;"></nav>
  </div>

  <!-- Entry Script -->
  <script type="module" src="/js/app.js?v=maas-2026-v3"></script>
</body>
</html>
